name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Use the Kings icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon/icon.png $RES/mipmap-$d/ic_launcher.png
            cp icon/icon.png $RES/mipmap-$d/ic_launcher_round.png
            cp icon/icon.png $RES/mipmap-$d/ic_launcher_foreground.png
          done
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kings-Electricals-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
        with:
          name: Kings-Electricals-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
