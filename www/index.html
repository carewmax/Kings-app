<style>/* ============ KINGS ELECTRICALS & ELECTRONICS — design tokens ============ */
:root{
  --navy:#06265C; --navy-2:#0A3A86;
  --blue:#0B53B8; --blue-600:#0E4BA6; --blue-100:#E7F0FC; --blue-50:#F2F7FE;
  --red:#E1032B; --red-600:#C00325;
  --ink:#10203C; --muted:#5D6D88; --line:#DCE5F2;
  --bg:#F4F8FD; --panel:#FFFFFF;
  --ok:#0E9A57; --warn:#B46A00;
  --shot-1:#FFFFFF; --shot-2:#EDF3FB; --shot-3:#E0E9F6;
  --shadow-sm:0 1px 2px rgba(10,35,80,.08);
  --shadow:0 6px 20px rgba(10,35,80,.10);
  --shadow-lg:0 18px 44px rgba(8,30,70,.18);
  --r:10px; --r-lg:16px;
  --maxw:1240px;
  --head-h:0px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    /* Kings branding stays light — only the page shell shifts slightly so the
       site never renders as dark-on-dark inside a themed viewer. */
    --bg:#EEF3FA;
  }
}
:root[data-theme="dark"]{ --bg:#EEF3FA; }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Archivo","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.55; letter-spacing:-.005em;
  overflow-x:hidden;
}
img{max-width:100%; display:block}
a{color:inherit; text-decoration:none}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3,h4{margin:0; line-height:1.12; letter-spacing:-.02em; font-weight:800}
p{margin:0 0 .8em}
:focus-visible{outline:3px solid #F5A623; outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 18px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;background:#fff;padding:10px 16px;z-index:200}
.skip:focus{left:12px;top:8px}

/* ============ header ============ */
.announce{background:var(--navy); color:#fff; font-size:12.5px; font-weight:600}
.announce .wrap{display:flex; align-items:center; gap:10px; justify-content:center; padding:7px 44px 7px 18px; position:relative; text-align:center}
.announce b{color:#FFD24A}
.announce .x{position:absolute; right:12px; top:50%; transform:translateY(-50%); background:transparent; border:0; color:#cfe0ff; cursor:pointer; padding:4px; line-height:0; border-radius:4px}
.announce .x:hover{color:#fff}
header.site{position:sticky; top:0; z-index:60; background:#fff; box-shadow:0 2px 14px rgba(8,34,80,.08)}
.hbar{display:flex; align-items:center; gap:18px; padding:11px 18px; max-width:var(--maxw); margin:0 auto}
.logo{display:flex; align-items:center; gap:0; flex:0 0 auto}
.logo svg{height:40px; width:auto}
.searchbox{flex:1; max-width:520px; position:relative}
.searchbox form{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:8px; background:#fff; overflow:hidden; transition:border-color .15s}
.searchbox form:focus-within{border-color:var(--blue)}
.searchbox input{flex:1; border:0; padding:9px 12px; outline:0; min-width:0; background:transparent}
.searchbox button{background:var(--blue); border:0; color:#fff; padding:9px 13px; cursor:pointer; line-height:0}
.searchbox button:hover{background:var(--blue-600)}
.sugg{position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-lg); overflow:hidden; z-index:70}
.sugg .grp{padding:8px 12px 4px; font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.04em}
.sugg a,.sugg button.row{display:flex; gap:10px; align-items:center; width:100%; text-align:left; background:none; border:0; padding:8px 12px; cursor:pointer}
.sugg a:hover,.sugg button.row:hover{background:var(--blue-50)}
.sugg .thumb{width:38px;height:38px;border-radius:6px;overflow:hidden;flex:0 0 auto}
.sugg .nm{font-weight:600; font-size:13.5px}
.sugg .pr{margin-left:auto; font-weight:800; color:var(--blue); font-size:13px; white-space:nowrap}
.hicons{display:flex; align-items:center; gap:4px; margin-left:auto}
.icbtn{position:relative; background:none; border:0; padding:8px; border-radius:8px; cursor:pointer; color:var(--navy); line-height:0}
.icbtn:hover{background:var(--blue-50)}
.badge{position:absolute; top:1px; right:0; background:var(--red); color:#fff; font-size:10px; font-weight:800; min-width:17px; height:17px; border-radius:9px; display:grid; place-items:center; padding:0 4px}
nav.main{background:var(--navy)}
nav.main .wrap{display:flex; align-items:center; gap:2px; padding:0 18px}
nav.main a,nav.main button{background:none; border:0; color:#E7EFFB; font-size:13.5px; font-weight:600; padding:11px 14px; cursor:pointer; display:flex; align-items:center; gap:5px}
nav.main a:hover,nav.main button:hover,nav.main a.on{background:rgba(255,255,255,.12); color:#fff}
.megawrap{position:relative}
/* author rules beat the UA sheet, so [hidden] has to be restated here */
.mega[hidden]{display:none}
.mega{position:absolute; top:100%; left:0; background:#fff; border-radius:0 0 12px 12px; box-shadow:var(--shadow-lg); padding:18px; display:grid; grid-template-columns:repeat(3,minmax(170px,1fr)); gap:16px 26px; z-index:65; min-width:620px; max-height:min(72vh,600px); overflow:auto}
.mega h5{margin:0 0 6px; font-size:12px; color:var(--blue); letter-spacing:.02em}
/* these live inside nav.main, so they must out-specify `nav.main a` */
nav.main .mega a{display:block; padding:5px 0; color:var(--ink); font-size:13.5px; font-weight:500; background:none}
nav.main .mega a:hover{color:var(--blue); background:none; text-decoration:underline}
.burger{display:none}
@media (max-width:900px){
  .hbar{gap:10px; padding:9px 14px; flex-wrap:wrap}
  .logo svg{height:28px}
  .searchbox{order:3; flex-basis:100%; max-width:none}
  nav.main{display:none}
  .burger{display:inline-flex}
}
/* mobile drawer */
.drawer{position:fixed; inset:0; z-index:120; display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute; inset:0; background:rgba(6,25,60,.55)}
.drawer .panel{position:absolute; top:0; bottom:0; left:0; width:min(320px,86vw); background:#fff; display:flex; flex-direction:column; animation:slideIn .22s ease}
.drawer.right .panel{left:auto; right:0; width:min(400px,92vw); animation:slideInR .22s ease}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:none}}
@keyframes slideInR{from{transform:translateX(100%)}to{transform:none}}
.drawer .dhead{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line)}
.drawer .dhead h3{font-size:16px}
.drawer .dbody{overflow:auto; flex:1; padding:8px 0}
.drawer .dbody a.mrow{display:flex; align-items:center; justify-content:space-between; padding:13px 18px; font-weight:600; border-bottom:1px solid #F0F4FA}
.drawer .dbody a.mrow.sub{padding-left:34px; font-weight:500; font-size:14px; color:var(--muted)}
.xbtn{background:none;border:0;cursor:pointer;padding:6px;line-height:0;color:var(--navy);border-radius:6px}
.xbtn:hover{background:var(--blue-50)}

/* ============ buttons & bits ============ */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:8px; padding:11px 20px; font-weight:700; font-size:14px; cursor:pointer; transition:background .15s, transform .08s}
.btn:active{transform:translateY(1px)}
.btn.blue{background:var(--blue); color:#fff}
.btn.blue:hover{background:var(--blue-600)}
.btn.red{background:var(--red); color:#fff}
.btn.red:hover{background:var(--red-600)}
.btn.ghost{background:#fff; color:var(--navy); border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue); color:var(--blue)}
.btn.navy{background:var(--navy); color:#fff}
.btn.navy:hover{background:var(--navy-2)}
.btn.block{width:100%}
.btn.sm{padding:8px 14px; font-size:13px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; padding:4px 9px; border-radius:20px}
.pill.new{background:var(--blue); color:#fff}
.pill.sale{background:var(--red); color:#fff}
.pill.best{background:#FFD24A; color:#5B3B00}
.pill.out{background:#EDF1F7; color:var(--muted)}
.stars{display:inline-flex; gap:1px; color:#F5A623; line-height:0}
.sec{padding:34px 0}
.sechead{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px}
.sechead h2{font-size:23px; color:var(--navy)}
.sechead a{color:var(--blue); font-weight:700; font-size:13.5px}
.sechead a:hover{text-decoration:underline}
.card{background:#fff; border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-sm)}
.crumbs{font-size:12.5px; color:var(--muted); padding:12px 0; display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.crumbs a:hover{color:var(--blue)}
.crumbs span.sep{color:#B8C5D8}

/* ============ the one consistent product backdrop ============ */
/* Every product image on this site sits on this exact backdrop; the product
   cutout floats on top of it and is never stretched to fill the frame. */
.shot{position:relative; background:radial-gradient(118% 92% at 50% 8%, var(--shot-1) 0%, var(--shot-2) 58%, var(--shot-3) 100%); overflow:hidden; border-radius:8px}
.shot::after{content:""; position:absolute; left:14%; right:14%; bottom:9%; height:9%; border-radius:50%; background:radial-gradient(50% 50% at 50% 50%, rgba(12,40,90,.20), rgba(12,40,90,0) 70%)}
.shot > .float{position:absolute; inset:9% 12% 13%; display:grid; place-items:center; z-index:1}
.shot > .float > svg,.shot > .float > img{max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; filter:drop-shadow(0 8px 12px rgba(10,35,80,.16))}
.shot.sq{aspect-ratio:1/1}
.shot.tall{aspect-ratio:4/5}

/* ============ product card ============ */
.pgrid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}
.pgrid.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pcard{background:#fff; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column; position:relative; transition:box-shadow .18s, border-color .18s}
.pcard:hover{box-shadow:var(--shadow); border-color:#C6D6EE}
.pcard .shot{border-radius:0}
.pcard .tags{position:absolute; top:9px; left:9px; display:flex; flex-direction:column; gap:5px; z-index:3}
.pcard .wish{position:absolute; top:9px; right:9px; z-index:3; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:50%; width:30px; height:30px; display:grid; place-items:center; cursor:pointer; color:var(--muted)}
.pcard .wish:hover{color:var(--red); border-color:#F3C6CF}
.pcard .wish.on{color:var(--red); border-color:#F3C6CF; background:#fff}
.pcard .quick{position:absolute; left:0; right:0; bottom:0; background:rgba(6,38,92,.92); color:#fff; border:0; padding:9px; font-size:12.5px; font-weight:700; cursor:pointer; transform:translateY(100%); transition:transform .18s}
.pcard .media{position:relative; overflow:hidden}
.pcard:hover .quick,.pcard:focus-within .quick{transform:none}
.pcard .body{padding:11px 12px 13px; display:flex; flex-direction:column; gap:5px; flex:1}
.pcard .brand{font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.03em}
.pcard .nm{font-size:13.5px; font-weight:600; line-height:1.35; min-height:2.7em; color:var(--ink)}
.pcard .nm:hover{color:var(--blue)}
.pcard .price{font-size:15.5px; font-weight:800; color:var(--blue); display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
.price.onreq{color:var(--navy); font-size:14.5px; font-weight:700}
.pinfo .price.onreq{font-size:22px}
.pcard .was{font-size:12px; font-weight:600; color:#9AA8BE; text-decoration:line-through}
.pcard .rate{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--muted)}
.pcard .btn{margin-top:4px}

/* ============ home ============ */
.hero{position:relative; background:linear-gradient(103deg,#F7FAFF 0%,#EAF2FE 38%,#0B53B8 38.2%,#0A46A0 100%); border-radius:0 0 var(--r-lg) var(--r-lg); overflow:hidden; color:var(--navy)}
.hero .swoosh{position:absolute; inset:0; pointer-events:none}
.hero .inner{position:relative; display:grid; grid-template-columns:minmax(280px,.85fr) 1.15fr; gap:12px; align-items:center; max-width:var(--maxw); margin:0 auto; padding:44px 18px 40px; z-index:2}
.hero h1{font-size:clamp(30px,4.3vw,50px); line-height:1.03; color:var(--navy); letter-spacing:-.03em}
.hero h1 .r{color:var(--red)}
.hero p.sub{font-size:clamp(15px,1.5vw,18px); color:#2A4573; font-weight:500; max-width:26ch; margin:14px 0 20px}
.hero .cta{display:flex; gap:10px; flex-wrap:wrap}
.hero .cluster{position:relative; min-height:300px; display:grid; place-items:end center}
.hero .cluster .row{display:flex; align-items:flex-end; justify-content:center; gap:6px; width:100%;
  filter:drop-shadow(0 16px 22px rgba(4,20,50,.35))}
.hero .cluster .row > span{min-width:0; display:flex; align-items:flex-end}
.hero .cluster .row > span > svg,.hero .cluster .row > span > img{width:100%; height:auto}
.hero .heroslide{display:none}
.hero .heroslide.on{display:grid}
.herodots{position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:3}
.herodots button{width:9px; height:9px; border-radius:50%; border:0; background:rgba(255,255,255,.55); cursor:pointer; padding:0}
.herodots button.on{background:#fff; width:22px; border-radius:5px}
@media (max-width:820px){
  .hero{background:linear-gradient(170deg,#F7FAFF 0%,#EAF2FE 52%,#0B53B8 52.2%,#0A46A0 100%)}
  .hero .inner{grid-template-columns:1fr; padding:30px 18px 34px; text-align:left}
  .hero .cluster{min-height:210px; place-items:center}
}
.catstrip{background:#fff; border:1px solid var(--line); border-radius:var(--r); margin-top:-24px; position:relative; z-index:5; display:grid; grid-template-columns:repeat(8,1fr); box-shadow:var(--shadow)}
.catstrip a{display:flex; flex-direction:column; align-items:center; gap:7px; padding:15px 8px; text-align:center; font-size:11.5px; font-weight:700; color:var(--navy); border-right:1px solid #EDF2F9}
.catstrip a:last-child{border-right:0}
.catstrip a:hover{background:var(--blue-50); color:var(--blue)}
.catstrip svg{color:var(--blue)}
@media (max-width:900px){
  .catstrip{grid-template-columns:repeat(4,1fr)}
  .catstrip a{border-bottom:1px solid #EDF2F9}
}
@media (max-width:520px){ .catstrip{grid-template-columns:repeat(3,1fr)} }
.catcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px}
.catcard{background:#fff; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; display:block}
.catcard:hover{box-shadow:var(--shadow); border-color:#C6D6EE}
.catcard .shot{aspect-ratio:16/10}
.catcard .cc{padding:11px 13px; font-weight:800; color:var(--navy); display:flex; justify-content:space-between; align-items:center; font-size:14px}
.catcard .cc small{color:var(--muted); font-weight:600}
.trust{display:grid; grid-template-columns:repeat(4,1fr); background:#fff; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.trust div{display:flex; gap:11px; align-items:center; padding:15px 16px; border-right:1px solid #EDF2F9}
.trust div:last-child{border-right:0}
.trust b{display:block; font-size:13.5px; color:var(--navy)}
.trust small{color:var(--muted); font-size:12px}
.trust svg{color:var(--blue); flex:0 0 auto}
@media (max-width:820px){ .trust{grid-template-columns:repeat(2,1fr)} .trust div{border-bottom:1px solid #EDF2F9} }
.promo{position:relative; background:linear-gradient(100deg,var(--navy) 0%,var(--blue) 62%,var(--red) 62.2%,var(--red-600) 100%); border-radius:var(--r-lg); color:#fff; overflow:hidden; padding:26px 28px; display:grid; grid-template-columns:1.3fr .7fr; gap:16px; align-items:center}
.promo h3{font-size:24px}
.promo p{color:#D6E4FA; margin:8px 0 16px; max-width:46ch}
.promo .art{display:grid; place-items:center}
@media (max-width:760px){ .promo{grid-template-columns:1fr; background:linear-gradient(160deg,var(--navy),var(--blue))} }
.rail{display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; scrollbar-width:thin}
.rail > *{flex:0 0 232px; scroll-snap-align:start}

/* ============ shop ============ */
.shoplayout{display:grid; grid-template-columns:238px 1fr; gap:22px; align-items:start; padding-bottom:40px}
@media (max-width:900px){ .shoplayout{grid-template-columns:1fr} .sidebar{display:none} }
.sidebar{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:14px; position:sticky; top:150px}
.sidebar h4{font-size:12.5px; color:var(--navy); margin:14px 0 8px; letter-spacing:.02em}
.sidebar h4:first-child{margin-top:0}
.sidebar label{display:flex; gap:8px; align-items:center; padding:4px 0; font-size:13.5px; color:#31415E; cursor:pointer}
.sidebar label:hover{color:var(--blue)}
.sidebar input[type=checkbox],.sidebar input[type=radio]{accent-color:var(--blue); width:15px; height:15px}
.sidebar .catlist a{display:block; padding:7px 10px; border-radius:7px; font-size:13.5px; font-weight:600; color:#31415E}
.sidebar .catlist a.on{background:var(--blue); color:#fff}
.sidebar .catlist a:hover:not(.on){background:var(--blue-50); color:var(--blue)}
.toolbar{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:14px}
.toolbar .count{font-size:13px; color:var(--muted)}
select.sel{border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff; font-size:13.5px; font-weight:600}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.chip{display:inline-flex; gap:6px; align-items:center; background:var(--blue-100); color:var(--blue-600); border:0; border-radius:20px; padding:5px 10px; font-size:12px; font-weight:700; cursor:pointer}
.pager{display:flex; gap:6px; justify-content:center; padding:26px 0 8px}
.pager button{min-width:34px; height:34px; border-radius:7px; border:1px solid var(--line); background:#fff; font-weight:700; font-size:13px; cursor:pointer}
.pager button.on{background:var(--blue); color:#fff; border-color:var(--blue)}
.pager button[disabled]{opacity:.4}
.drawer .sidebar{display:block !important}
.filterbtn{display:none}
@media (max-width:900px){ .filterbtn{display:inline-flex} }

/* ============ product detail ============ */
.pdp{display:grid; grid-template-columns:1.05fr 1fr; gap:34px; align-items:start; padding-bottom:10px}
@media (max-width:880px){ .pdp{grid-template-columns:1fr; gap:20px} }
.gallery{display:grid; grid-template-columns:72px 1fr; gap:12px}
.gallery .thumbs{display:flex; flex-direction:column; gap:9px}
.gallery .thumbs button{padding:0; border:1.5px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; background:none}
.gallery .thumbs button.on{border-color:var(--blue)}
.gallery .main{position:relative; border:1px solid var(--line); border-radius:var(--r)}
.gallery .main .shot{aspect-ratio:1/1}

.acctnav{background:#fff; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}

.acctnav button:last-child{border-bottom:0}

.brandcard{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:18px; text-align:center}

.toasts{position:fixed; right:16px; bottom:16px; z-index:200; display:flex; flex-direction:column; gap:9px; max-width:min(340px,90vw)}
.toast{background:#fff; border:1px solid var(--line); border-left:4px solid var(--ok); border-radius:10px; box-shadow:var(--shadow-lg); padding:11px 13px; display:flex; gap:11px; align-items:center; animation:pop .22s ease}
.toast.err{border-left-color:var(--red)}
.toast .t{font-weight:700; font-size:13.5px}
.toast small{color:var(--muted); font-size:12px}
@keyframes pop{from{opacity:0; transform:translateY(8px)}to{opacity:1;transform:none}}
.modal{position:fixed; inset:0; z-index:140; display:grid; place-items:center; padding:18px; background:rgba(6,25,60,.55)}

.modal .box h3{font-size:19px; color:var(--navy); margin-bottom:10px}
.modal .close{position:absolute; top:12px; right:12px}
.ok-anim{width:74px;height:74px;border-radius:50%;background:#E7F6EE;display:grid;place-items:center;margin:0 auto 6px}
.ok-anim svg{color:var(--ok); animation:tick .45s ease}
@keyframes tick{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}

@media (max-width:560px){
  .qvgrid{grid-template-columns:1fr !important}
  .buyrow{grid-template-columns:1fr}
  .pagehead{padding:22px 18px}
  .sec{padding:26px 0}
}

.rail::-webkit-scrollbar-thumb{background:#CBD7E8;border-radius:4px}

/* ============================================================
   CORE — state, storage, shared components
   ============================================================ */
const KEY = "kings.v1";
const S = {
  cart: [], wish: [], compare: [], recent: [], user: null, orders: [], announceClosed: false
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) Object.assign(S, JSON.parse(raw));
  } catch (e) { /* storage unavailable — the site still works, nothing is remembered */ }
  if (!Array.isArray(S.cart)) S.cart = [];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
load();

/* ---------- helpers ---------- */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => SITE.currency + " " + Number(n).toLocaleString("en-US");
/* products Kings has not priced yet show "Price on request" and route to the
   store instead of into the cart */
const priced = (p) => p && p.price != null;
const priceLabel = (p) => priced(p) ? money(p.price) : "Price on request";
const telHref = () => "tel:" + SITE.phones[0].replace(/\s/g, "");
const byId = (id) => PRODUCTS.find(p => p.id === id);
const catBySlug = (s) => CATEGORIES.find(c => c.slug === s);
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const cartCount = () => S.cart.reduce((n, l) => n + l.qty, 0);
const cartSubtotal = () => S.cart.reduce((n, l) => { const p = byId(l.id); return n + (priced(p) ? p.price * l.qty : 0); }, 0);
const discountTotal = () => S.cart.reduce((n, l) => { const p = byId(l.id); return n + (p && p.was ? (p.was - p.price) * l.qty : 0); }, 0);
function reviewsFor(p) {
  const out = [];
  const n = Math.min(p.reviews, 4);
  for (let i = 0; i < n; i++) {
    const r = REVIEW_POOL[(p.id.length + i * 3) % REVIEW_POOL.length];
    out.push({ who: r[0], rate: r[1], text: r[2], when: ["2 weeks ago", "1 month ago", "2 months ago", "3 months ago"][i] });
  }
  return out;
}
function relatedTo(p) {
  return PRODUCTS.filter(x => x.id !== p.id && (x.cats.some(c => p.cats.includes(c)) || x.brand === p.brand)).slice(0, 8);
}
function discountPct(p) { return p.was ? Math.round((1 - p.price / p.was) * 100) : 0; }

/* ---------- toasts ---------- */
function toast(title, sub, kind) {
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast" + (kind === "err" ? " err" : "");
  el.setAttribute("role", "status");
  el.innerHTML = `<span style="color:${kind === "err" ? "var(--red)" : "var(--ok)"}">${kind === "err" ? I.x : I.check}</span>
    <div><div class="t">${esc(title)}</div>${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 320); }, 2800);
}

/* ---------- cart / wishlist / compare ---------- */
function addToCart(id, qty) {
  const p = byId(id); if (!p) return;
  if (!priced(p)) { toast("Price on request", "Call the store for a price on " + p.name, "err"); go("#/product/" + id); return; }
  if (p.stock <= 0) { toast("Out of stock", p.name + " is not available right now", "err"); return; }
  const line = S.cart.find(l => l.id === id);
  const want = (line ? line.qty : 0) + (qty || 1);
  if (want > p.stock) { toast("Only " + p.stock + " left", "We have adjusted the quantity to what is in stock", "err"); }
  const final = Math.min(want, p.stock);
  if (line) line.qty = final; else S.cart.push({ id: id, qty: final });
  save(); syncChrome();
  toast("Added to cart", p.name);
  openCart();
}
function setQty(id, qty) {
  const p = byId(id); const line = S.cart.find(l => l.id === id); if (!line) return;
  line.qty = Math.max(1, Math.min(qty, p ? p.stock : 99));
  save(); syncChrome(); rerenderRoute();
}
function removeFromCart(id) {
  S.cart = S.cart.filter(l => l.id !== id); save(); syncChrome(); rerenderRoute();
  const d = $("#cartdrawer"); if (d && d.classList.contains("open")) renderCartDrawer();
  toast("Removed from cart");
}
function toggleWish(id, silent) {
  const i = S.wish.indexOf(id);
  if (i > -1) { S.wish.splice(i, 1); if (!silent) toast("Removed from wishlist"); }
  else { S.wish.push(id); if (!silent) toast("Saved to wishlist", byId(id).name); }
  save(); syncChrome();
  $$('.wish[data-w="' + id + '"]').forEach(b => {
    const on = S.wish.includes(id);
    b.classList.toggle("on", on); b.innerHTML = on ? I.heartFull : I.heartSm;
    b.setAttribute("aria-pressed", on);
  });
  if (location.hash.startsWith("#/wishlist")) rerenderRoute();
}
function toggleCompare(id) {
  const i = S.compare.indexOf(id);
  if (i > -1) S.compare.splice(i, 1);
  else {

/* ---------- search suggestions ---------- */
function suggest(v) {
  const box = $("#sugg"); if (!box) return;
  const q = (v || "").trim().toLowerCase();
  if (!q) {
    const pop = ["Refrigerator", "Generator", "Smart TV", "Washing machine", "Standing fan"];
    box.innerHTML = `<div class="sugg">
      ${S.recent.length ? `<div class="grp">Recent searches</div>` + S.recent.slice(0, 3).map(r =>
        `<button class="row" onclick="runSearch('${esc(r)}')">${I.search}<span class="nm">${esc(r)}</span></button>`).join("") : ""}
      <div class="grp">Popular searches</div>
      ${pop.map(r => `<button class="row" onclick="runSearch('${r}')">${I.search}<span class="nm">${r}</span></button>`).join("")}</div>`;
    return;
  }
  const hits = searchProducts(q).slice(0, 5);
  box.innerHTML = `<div class="sugg">
    ${hits.length ? `<div class="grp">Products</div>` + hits.map(p => `
      <a href="#/product/${p.id}" onclick="clearSugg()">
        <span class="thumb">${shot(p, "sq", 34)}</span>
        <span class="nm">${esc(p.name)}<br><small style="color:var(--muted);font-weight:500">${esc(p.brand)}</small></span>
        <span class="pr">${money(p.price)}</span></a>`).join("")
      : `<div style="padding:14px 12px;color:var(--muted);font-size:13.5px">Nothing matches “${esc(q)}”. Try a product or brand name.</div>`}
    <button class="row" style="border-top:1px solid var(--line);font-weight:700;color:var(--blue)" onclick="runSearch(${JSON.stringify(q)})">
      ${I.search}<span class="nm" style="color:var(--blue)">See all results for “${esc(q)}”</span></button></div>`;
}
function clearSugg() { const b = $("#sugg"); if (b) b.innerHTML = ""; const q = $("#q"); if (q) q.blur(); }
function searchProducts(q) {
  q = q.toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  return PRODUCTS.map(p => {
    const hay = [p.name, p.brand, p.type, p.sub, p.blurb, p.cats.map(c => (catBySlug(c) || {}).name).join(" ")].join(" ").toLowerCase();
    let score = 0;
    words.forEach(w => { if (hay.includes(w)) score += p.name.toLowerCase().includes(w) ? 3 : 1; });
    return { p: p, score: score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).map(x => x.p);
}
function doSearch(e) { e.preventDefault(); runSearch($("#q").value); return false; }
function runSearch(q) {
  q = (q || "").trim(); if (!q) return;
  S.recent = [q].concat(S.recent.filter(r => r !== q)).slice(0, 6); save();
  clearSugg(); closeMenu();
  go("#/search?q=" + encodeURIComponent(q));
}

const V = {};

function parseRoute() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const q = {};
  new URLSearchParams(qs || "").forEach((v, k) => q[k] = v);
  return { path: path, parts: parts, q: q };
}
function rerenderRoute() { render(true); }

function render(keepScroll) {
  const r = parseRoute();
  const main = $("#main");
  const name = r.parts[0] || "home";
  const view = V[name] || V["404"];
  main.innerHTML = view(r);
  closeMega();
  syncChrome();
  renderCompareBar();
  if (!keepScroll && LAST !== location.hash) window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  LAST = location.hash;
  if (typeof afterRender === "function") afterRender(r);
}

/* ============ SHOP / CATEGORY / SEARCH / NEW / BEST / OFFERS ============ */
const PAGE_SIZE = 12;

function filterState(r) {
  return {
    cat: r.q.cat || (r.parts[0] === "category" ? r.parts[1] : ""),
    sub: r.q.sub || "",
    brand: (r.q.brand || "").split(",").filter(Boolean),
    price: r.q.price || "",
    avail: r.q.avail || "",
    rating: r.q.rating || "",
    sort: r.q.sort || "featured",
    page: parseInt(r.q.page || "1", 10),
    q: r.q.q || ""
  };
}
const PRICE_BANDS = [
  ["0-1000000", "Under SLE 1,000,000", 0, 1000000],
  ["1000000-3000000", "SLE 1,000,000 – 3,000,000", 1000000, 3000000],
  ["3000000-6000000", "SLE 3,000,000 – 6,000,000", 3000000, 6000000],
  ["6000000-10000000", "SLE 6,000,000 – 10,000,000", 6000000, 10000000],
  ["10000000-999999999", "SLE 10,000,000 and above", 10000000, 999999999]
];

function applyFilters(list, f) {
  let out = list.slice();
  if (f.cat) out = out.filter(p => p.cats.includes(f.cat));
  if (f.sub) out = out.filter(p => p.sub === f.sub || (p.cats.includes(f.cat) && p.sub === f.sub));
  if (f.brand.length) out = out.filter(p => f.brand.includes(p.brand));
  if (f.price) { const b = PRICE_BANDS.find(x => x[0] === f.price); if (b) out = out.filter(p => priced(p) && p.price >= b[2] && p.price <= b[3]); }
  if (f.avail === "in") out = out.filter(p => p.stock > 0);
  if (f.avail === "out") out = out.filter(p => p.stock <= 0);
  if (f.rating) out = out.filter(p => p.rating >= parseFloat(f.rating));
  const sorters = {
    featured: (a, b) => (b.isFeatured ? 1 : 0) - (a.isFeatured ? 1 : 0),
    newest: (a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0),
    best: (a, b) => (b.isBest ? 1 : 0) - (a.isBest ? 1 : 0) || b.reviews - a.reviews,
    "price-asc": (a, b) => (priced(a) ? a.price : Infinity) - (priced(b) ? b.price : Infinity),
    "price-desc": (a, b) => (priced(b) ? b.price : -Infinity) - (priced(a) ? a.price : -Infinity),
    rating: (a, b) => b.rating - a.rating
  };
  out.sort(sorters[f.sort] || sorters.featured);
  return out;
}
function setFilter(k, v) {
  const r = parseRoute();
  const q = Object.assign({}, r.q);
  if (v === "" || v == null) delete q[k]; else q[k] = v;
  if (k !== "page") delete q.page;
  const qs = Object.keys(q).map(x => x + "=" + encodeURIComponent(q[x])).join("&");
  location.hash = r.path + (qs ? "?" + qs : "");
}
function toggleBrand(b) {
  const f = filterState(parseRoute());
  const i = f.brand.indexOf(b);
  if (i > -1) f.brand.splice(i, 1); else f.brand.push(b);
  setFilter("brand", f.brand.join(","));
}

    </div>
    ${f.cat && catBySlug(f.cat) ? `<h4>${esc(catBySlug(f.cat).name)} types</h4>
      ${catBySlug(f.cat).subs.map(s => `<label><input type="radio" name="sub" ${f.sub === s ? "checked" : ""}
        onchange="setFilter('sub','${esc(s)}')"> ${esc(s)}</label>`).join("")}
      ${f.sub ? `<button class="chip" style="margin-top:6px" onclick="setFilter('sub','')">Clear type ${I.x}</button>` : ""}` : ""}
    <h4>Price (${SITE.currency})</h4>

function clearFilters() { const r = parseRoute(); location.hash = r.path + (r.q.q ? "?q=" + encodeURIComponent(r.q.q) : ""); }
function openFilters() {
  const f = filterState(parseRoute());

    <div class="panel" role="dialog" aria-label="Filters">

    </div>`;
  d.classList.add("open"); document.body.style.overflow = "hidden";

function closeFilters() { $("#filterdrawer").classList.remove("open"); document.body.style.overflow = ""; }

function listPage(opts) {
  const f = opts.f, all = opts.list;
  const items = applyFilters(all, f);
  const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  const page = Math.min(f.page, pages);
  const slice = items.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  const chips = [];
  if (f.sub) chips.push(["sub", f.sub, ""]);
  if (f.price) { const b = PRICE_BANDS.find(x => x[0] === f.price); if (b) chips.push(["price", b[1], ""]); }
  f.brand.forEach(b => chips.push(["brandone", b, b]));
  if (f.avail) chips.push(["avail", f.avail === "in" ? "In stock" : "Out of stock", ""]);
  if (f.rating) chips.push(["rating", f.rating + "★ and above", ""]);
  return `<div class="wrap">
    ${opts.crumbs || ""}
    ${opts.head}
    <div class="shoplayout">
      ${sidebarHTML(f)}
      <div>
        <div class="toolbar">
          <div style="display:flex;gap:10px;align-items:center">
            <button class="btn ghost sm filterbtn" onclick="openFilters()">${I.filter} Filters</button>
            <span class="count">Showing ${items.length ? (page - 1) * PAGE_SIZE + 1 : 0}–${Math.min(page * PAGE_SIZE, items.length)} of ${items.length} products</span>
          </div>
          <label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)">Sort by
            <select class="sel" onchange="setFilter('sort',this.value)">
              ${[["featured", "Featured"], ["newest", "Newest"], ["best", "Best selling"], ["price-asc", "Price: low to high"],
                 ["price-desc", "Price: high to low"], ["rating", "Highest rated"]].map(o =>
                `<option value="${o[0]}" ${f.sort === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}
            </select></label>
        </div>
        ${chips.length ? `<div class="chips">${chips.map(c => `<button class="chip" onclick="${c[0] === "brandone" ? `toggleBrand('${c[2]}')` : `setFilter('${c[0]}','')`}">${esc(c[1])} ${I.x}</button>`).join("")}
          <button class="chip" style="background:#FFE9EE;color:var(--red)" onclick="clearFilters()">Clear all ${I.x}</button></div>` : ""}
        ${slice.length ? `<div class="pgrid">${slice.map(productCard).join("")}</div>` : emptyResults(f)}
        ${pages > 1 ? `<div class="pager">
          <button ${page === 1 ? "disabled" : ""} onclick="setFilter('page',${page - 1})" aria-label="Previous page">${I.chevL}</button>
          ${Array.from({ length: pages }, (_, i) => `<button class="${page === i + 1 ? "on" : ""}" onclick="setFilter('page',${i + 1})">${i + 1}</button>`).join("")}
          <button ${page === pages ? "disabled" : ""} onclick="setFilter('page',${page + 1})" aria-label="Next page">${I.chev}</button>
        </div>` : ""}
      </div>
    </div></div>`;
}

        <button class="btn blue" onclick="coNext(2)">Continue to payment</button></div>`;
  }
  return `<h3 style="font-size:17px;color:var(--navy);margin-bottom:12px">Payment</h3>

function coNext(step) {
  const bad = [];
  const val = (id) => ($("#c-" + id) || {}).value || "";
  if (step === 1) {
    CO.data.name = val("name").trim(); CO.data.phone = val("phone").trim(); CO.data.email = val("email").trim();
    if (!CO.data.name) bad.push("name");
    if (CO.data.phone.replace(/\D/g, "").length < 8) bad.push("phone");
    if (CO.data.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(CO.data.email)) bad.push("email");
  } else {
    CO.data.addr = val("addr").trim(); CO.data.area = val("area").trim();
    CO.data.when = val("when"); CO.data.note = val("note");
    if (!CO.data.addr) bad.push("addr");
    if (!CO.data.area) bad.push("area");
  }
  $$(".field").forEach(f => f.classList.remove("bad"));
  if (bad.length) {
    bad.forEach(b => { const f = $("#f-" + b); if (f) f.classList.add("bad"); });
    const first = $("#f-" + bad[0] + " input"); if (first) first.focus();
    toast("Check the highlighted fields", "", "err"); return;
  }
  CO.step = step + 1; rerenderRoute();
}
function placeOrder() {
  const sub = cartSubtotal();
  const dopt = SITE.delivery.find(d => d.id === CO.delivery);
  const fee = sub >= SITE.freeDeliveryOver && CO.delivery !== "express" ? 0 : dopt.fee;
  const order = {
    num: "KE" + String(Date.now()).slice(-6),
    at: new Date().toISOString(),
    items: S.cart.map(l => ({ id: l.id, qty: l.qty, price: byId(l.id).price, name: byId(l.id).name })),
    total: sub + fee, fee: fee, delivery: dopt.name, pay: CO.pay, customer: Object.assign({}, CO.data),
    status: 0
  };
  S.orders.unshift(order); S.cart = []; save(); syncChrome();
  CO = { step: 1, data: order.customer, delivery: "standard", pay: "cash" };
  go("#/order/" + order.num);
}

function sendContact() {
  const bad = [];
  const v = id => ($("#ct-" + id) || {}).value.trim();
  if (!v("n")) bad.push("cn");
  if (v("p").replace(/\D/g, "").length < 8) bad.push("cp");
  if (v("e") && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("e"))) bad.push("ce");
  if (!v("m")) bad.push("cm");
  $$(".field").forEach(f => f.classList.remove("bad"));
  if (bad.length) { bad.forEach(b => { const f = $("#f-" + b); if (f) f.classList.add("bad"); }); toast("Check the highlighted fields", "", "err"); return; }
  $("#contactform").innerHTML = `<div style="text-align:center;padding:20px 0">
    <div class="ok-anim">${I.checkBig}</div>
    <h3 style="color:var(--navy);font-size:18px;margin-top:8px">Message ready to send</h3>

}

V["404"] = () => `<div class="wrap"><div class="empty" style="margin:26px 0 40px">
  <div style="font-size:62px;font-weight:800;color:var(--blue)">404</div>
  <h3>This page does not exist</h3>
  <p>The link may be old or mistyped. Everything Kings sells is still one tap away.</p>
  <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
    <a class="btn blue" href="#/shop">Go to the shop</a><a class="btn ghost" href="#/">Back home</a></div></div></div>`;

/* ============================================================
   BOOT
   ============================================================ */
function afterRender(r) {
  if (r.parts[0] === "home" || !r.parts.length) {
    heroIdx = 0;
    clearInterval(heroTimer);
    heroTimer = setInterval(heroNext, 6500);
  } else {
    clearInterval(heroTimer); heroTimer = null;
  }
}

function boot() {
  document.getElementById("chrome-top").innerHTML = headerHTML();
  document.getElementById("chrome-bottom").innerHTML = footerHTML();
  document.getElementById("menudrawer").innerHTML = menuHTML();
  document.getElementById("cartdrawer").innerHTML = `
    <div class="scrim" onclick="closeCart()"></div>
    <div class="panel" role="dialog" aria-label="Your cart">
      <div class="dhead"><h3>Your cart</h3><button class="xbtn" aria-label="Close cart" onclick="closeCart()">${I.x}</button></div>
      <div class="dbody" id="cartdrawerbody"></div>
      <div style="padding:14px 16px;border-top:1px solid var(--line)" id="cartdrawerfoot"></div>
    </div>`;
  if (S.announceClosed) { const a = $("#announce"); if (a) a.remove(); }
  if (!location.hash) location.hash = "#/";
  render(false);
  setInterval(rotateAnnounce, 7000);

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    ["qvmodal", "revmodal", "lb"].forEach(id => closeModal(id));
    closeCart(); closeMenu(); closeFilters(); closeMega();
  });
}
document.addEventListener("DOMContentLoaded", boot);
</script>
